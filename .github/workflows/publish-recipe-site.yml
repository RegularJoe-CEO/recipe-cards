name: Build and publish recipe cards

on:
  push:
    branches: [main]
    paths:
      - "recipes/**/recipe.json"
      - "recipes/**/recipe.pdf"
      - "recipes/**/recipe.md"
      - "scripts/build_site.py"
      - "requirements.txt"
      - ".github/workflows/publish-recipe-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install card renderer
        run: pip install --requirement requirements.txt

      - name: Build recipe pages and social cards
        run: python scripts/build_site.py --base-url "https://regularjoe-ceo.github.io/recipe-cards"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
